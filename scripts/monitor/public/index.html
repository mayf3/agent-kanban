<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Monitor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sessions-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .last-update {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 16px;
        }

        .session-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }

        .session-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }

        .session-card.active {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .agent-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .session-id {
            font-size: 0.8rem;
            opacity: 0.6;
            font-family: monospace;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-badge.inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .session-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 2px;
        }

        .detail-value {
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .sessions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Agent Monitor Dashboard</h1>
            <p class="subtitle">实时监控 OpenClaw Agent 会话状态</p>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="connectionStatus">连接中...</span>
            </div>
        </header>

        <div id="errorMessage" class="error-message"></div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总会话数</div>
                <div class="stat-value" id="totalSessions">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">活跃会话</div>
                <div class="stat-value" id="activeSessions">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Agent 数量</div>
                <div class="stat-value" id="agentCount">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">最后更新</div>
                <div class="stat-value" style="font-size: 1.2rem;" id="lastUpdate">-</div>
            </div>
        </div>

        <!-- Sessions List -->
        <div class="sessions-section">
            <div class="section-header">
                <h2 class="section-title">会话列表</h2>
                <span class="last-update" id="updateTime">等待数据...</span>
            </div>
            <div id="sessionsList" class="sessions-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">📡</div>
                    <p>正在加载会话数据...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = 'ws://localhost:3001';
        let ws = null;
        let reconnectTimer = null;

        // DOM Elements
        const elements = {
            totalSessions: document.getElementById('totalSessions'),
            activeSessions: document.getElementById('activeSessions'),
            agentCount: document.getElementById('agentCount'),
            lastUpdate: document.getElementById('lastUpdate'),
            updateTime: document.getElementById('updateTime'),
            sessionsList: document.getElementById('sessionsList'),
            connectionStatus: document.getElementById('connectionStatus'),
            errorMessage: document.getElementById('errorMessage')
        };

        // Format date
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 1000 / 60);
            
            if (diffMins < 1) return '刚刚';
            if (diffMins < 60) return `${diffMins} 分钟前`;
            
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours} 小时前`;
            
            return date.toLocaleString('zh-CN');
        }

        // Format number
        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'k';
            }
            return num.toString();
        }

        // Truncate text
        function truncate(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        // Render statistics
        function renderStats(summary) {
            elements.totalSessions.textContent = formatNumber(summary.total || 0);
            elements.activeSessions.textContent = formatNumber(summary.active || 0);
            elements.agentCount.textContent = formatNumber(summary.agents || 0);
            elements.lastUpdate.textContent = formatDate(summary.lastUpdate);
            elements.updateTime.textContent = `更新于 ${new Date(summary.lastUpdate).toLocaleTimeString('zh-CN')}`;
        }

        // Render sessions
        function renderSessions(sessions) {
            if (!sessions || sessions.length === 0) {
                elements.sessionsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无会话数据</p>
                    </div>
                `;
                return;
            }

            const html = sessions.map(session => {
                const isActive = session.isActive || false;
                const modified = formatDate(session.modified);
                
                return `
                    <div class="session-card ${isActive ? 'active' : ''}">
                        <div class="session-header">
                            <div>
                                <div class="agent-name">${session.agent || 'Unknown Agent'}</div>
                                <div class="session-id">${truncate(session.id || '', 24)}</div>
                            </div>
                            <div class="status-badge ${isActive ? 'active' : 'inactive'}">
                                ${isActive ? '活跃' : '非活跃'}
                            </div>
                        </div>
                        <div class="session-details">
                            <div class="detail-item">
                                <div class="detail-label">类型</div>
                                <div class="detail-value">${session.type || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">模型</div>
                                <div class="detail-value">${session.model || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">最后活跃</div>
                                <div class="detail-value">${modified}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">消息数</div>
                                <div class="detail-value">${session.messageCount || 0}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            elements.sessionsList.innerHTML = html;
        }

        // Handle state update
        function handleStateUpdate(data) {
            renderStats(data.summary);
            renderSessions(data.sessions);
            hideError();
        }

        // Show error
        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.style.display = 'block';
        }

        // Hide error
        function hideError() {
            elements.errorMessage.style.display = 'none';
        }

        // Connect to WebSocket
        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('WebSocket connected');
                elements.connectionStatus.textContent = '已连接';
                elements.connectionStatus.style.color = '#22c55e';
                hideError();
                
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received:', message.type);
                    
                    if (message.type === 'state-update') {
                        handleStateUpdate(message.data);
                    } else if (message.type === 'error') {
                        showError('错误: ' + message.message);
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                elements.connectionStatus.textContent = '连接断开，重连中...';
                elements.connectionStatus.style.color = '#ef4444';
                
                // Reconnect after 3 seconds
                reconnectTimer = setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                showError('WebSocket 连接错误');
            };
        }

        // Initial connection
        connect();

        // Fetch initial data via REST API as fallback
        fetch('http://localhost:3000/api/state')
            .then(res => res.json())
            .then(data => {
                handleStateUpdate(data);
            })
            .catch(err => {
                console.log('Initial fetch failed, waiting for WebSocket...');
            });
    </script>
</body>
</html>
